name: UniSkill Exchange CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sd2-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
         node-version: "22"

      - name: Install dependencies
        working-directory: pg-sd22
        run: npm install

      - name: Import database schema
        run: mysql -h 127.0.0.1 -uroot -ppassword sd2-db < pg-sd22/sd2-db.sql

      - name: Start app and smoke test
        working-directory: pg-sd22
        env:
          DB_CONTAINER: 127.0.0.1
          DB_PORT: 3306
          MYSQL_ROOT_USER: root
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sd2-db
          SESSION_SECRET: ci-secret
        run: |
          node index.js &
          sleep 5
          curl -f http://localhost:3000/ || exit 1
          curl -f http://localhost:3000/skills || exit 1
