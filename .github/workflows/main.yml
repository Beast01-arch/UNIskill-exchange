name: UniSkill Exchange CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sd2-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: pg-sd22
        run: npm install

      - name: Import Database Schema
        run: |
          mysql -h 127.0.0.1 \
                -uroot \
                -ppassword \
                sd2-db < pg-sd22/sd2-db.sql

      - name: Start Application and Run Smoke Tests
        working-directory: pg-sd22
        env:
          DB_CONTAINER: 127.0.0.1
          DB_PORT: 3306
          MYSQL_ROOT_USER: root
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sd2-db
          SESSION_SECRET: ci-secret
          NODE_ENV: test
        run: |
          node index.js &
          sleep 10
          curl -f http://localhost:3000/ || exit 1
          curl -f http://localhost:3000/skills || exit 1

      - name: Build Success
        run: echo "UniSkill Exchange CI Pipeline completed successfully."
